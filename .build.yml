image: debian/unstable
oauth: pages.sr.ht/PAGES:RW
packages:
- ruby-full
- ruby-dev
- hut
- jekyll
- libssl
- libssl4
repositories:
  experimental: https://deb.debian.org/debian experimental main

environment:
  site: disintegrated.parts
tasks:
- build: |
    cd $site
    bundle config set --local path vendor/bundle
    bundle install
    bundle exec jekyll build
- package: |
    cd $site/_site
    tar -cvz . > ../../site.tar.gz
- upload: |
    hut pages publish -d $site site.tar.gz  
