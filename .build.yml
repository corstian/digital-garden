image: debian/unstable
oauth: pages.sr.ht/PAGES:RW
packages:
- ruby-full
- ruby-dev
- hut
- jekyll
- openssl4
- build-essential
repositories:
  sr.ht: https://mirror.sr.ht/debian/sr.ht/ experimental main DEADBEEFCAFEF00D

environment:
  site: disintegrated.parts
tasks:
- install-bundler: |
    gem install bundler
- build: |
    cd $site
    bundle install
    bundle exec jekyll build
- package: |
    cd $site/_site
    tar -cvz . > ../../site.tar.gz
- upload: |
    hut pages publish -d $site site.tar.gz  
