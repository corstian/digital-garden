image: nixos/unstable
oauth: pages.sr.ht/PAGES:RW
repositories:
  nixpkgs: https://nixos.org/channels/nixpkgs-unstable
packages:
- ruby-full
- ruby-dev
- hut
- jekyll
- openssl4
- build-essential
environment:
  site: disintegrated.parts
tasks:
- install-bundler: |
    gem install bundler
- build: |
    cd $site
    bundle install
    bundle exec jekyll build
- package: |
    cd $site/_site
    tar -cvz . > ../../site.tar.gz
- upload: |
    hut pages publish -d $site site.tar.gz  
